<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ElectroCharge ⚡</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>

        /* RESET */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            font-family: 'Segoe UI', sans-serif;
        }

        /* 🔵 NAVBAR BLEUE */
        .navbar {
            background: linear-gradient(90deg, #0d6efd, #0a58ca);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .navbar-brand {
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 1.3rem;
        }

        .nav-link {
            color: white !important;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: #cfe2ff !important;
            transform: translateY(-2px);
        }

        /* CONTENU */
        .main-content {
            min-height: calc(100vh - 140px);
            padding-top: 30px;
        }

        /* CARTES */
        .card-hover {
            transition: 0.3s;
            border: none;
        }

        .card-hover:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 25px rgba(13,110,253,0.2);
        }

        /* 🔵 FOOTER */
        footer {
            background: #0d6efd;
            color: white;
            font-size: 0.9rem;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        
         <a class="navbar-brand d-flex align-items-center" href="/">
    <div style="
        width: 40px; 
        height: 40px; 
        border-radius: 50%; 
        background-color: #f0f7ff; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        overflow: hidden;
        margin-right: 10px;
        border: 2px solid #0056b3;">
        
        <img src="/static/images/logo.png" alt="Logo" style="width: 85%; height: auto;">
    </div>
    <span style="font-weight: bold">ElectroCharge</span>
       </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">
                        <i class="bi bi-house-door"></i> Accueil
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/borne/">
                        <i class="bi bi-ev-station"></i> Bornes
                    </a>
                </li>
                
                <li class="nav-item">
                    <a class="nav-link" href="/sessions/">
                        <i class="bi bi-lightning-charge"></i> Sessions
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/connecteur/">
                        <i class="bi bi-plug-fill"></i> Connecteur
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/admin/">
                        <i class="bi bi-gear"></i> Admin
                    </a>
                </li>

            </ul>

        </div>

    </div>
</nav>

<!-- CONTENU -->
<main class="main-content container">
    {% block content %}
    {% endblock %}
</main>

<!-- FOOTER -->
<footer class="text-center py-4 mt-5">
    <div class="container">
        ⚡ ElectroCharge © 2026 — Plateforme de gestion des bornes électriques
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
